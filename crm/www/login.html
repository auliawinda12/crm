<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ app_title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .login-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        /* Animated background shapes */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
            animation: float 8s ease-in-out infinite;
        }
        .bg-shape-1 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }
        .bg-shape-2 {
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            bottom: -80px;
            left: -80px;
            animation-delay: 2s;
        }
        .bg-shape-3 {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 4s;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(20px, -20px) scale(1.05); }
            50% { transform: translate(-10px, 15px) scale(0.95); }
            75% { transform: translate(15px, 10px) scale(1.02); }
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .logo-container {
            animation: logoFloat 3s ease-in-out infinite;
        }
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .input-group {
            position: relative;
        }
        .input-field {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.75rem;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .input-field::placeholder {
            color: transparent;
        }
        .input-field:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }
        .input-field:focus + .input-label,
        .input-field:not(:placeholder-shown) + .input-label {
            top: -0.5rem;
            left: 0.75rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.9);
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 0 0.5rem;
            border-radius: 0.25rem;
        }
        .input-label {
            position: absolute;
            left: 3rem;
            top: 1rem;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.6);
            transition: color 0.3s ease;
        }
        .input-field:focus ~ .input-icon {
            color: white;
        }
        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(102, 126, 234, 0.4);
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(102, 126, 234, 0.5);
        }
        .submit-btn:active {
            transform: translateY(0);
        }
        .submit-btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .link-text {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .link-text:hover {
            color: white;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }
        .divider span {
            padding: 0 1rem;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Animated background shapes -->
        <div class="bg-shape bg-shape-1"></div>
        <div class="bg-shape bg-shape-2"></div>
        <div class="bg-shape bg-shape-3"></div>

        <!-- Login Panel -->
        <div class="glass-panel" style="width: 100%; max-width: 440px; border-radius: 1.5rem; padding: 3rem;">
            <div style="position: relative; z-index: 1;">
                <!-- Logo Section -->
                <div class="logo-container" style="text-align: center; margin-bottom: 2rem;">
                    <img src="/assets/crm/images/new_logo.svg" alt="CRM Logo" style="width: 80px; height: 80px; margin-bottom: 1rem; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));">
                    <h1 style="font-size: 2rem; font-weight: 700; color: white; margin-bottom: 0.5rem;">Welcome Back</h1>
                    <p style="color: rgba(255,255,255,0.8); font-size: 0.95rem;">Sign in to continue to your account</p>
                </div>

                <!-- Login Form -->
                <form action="/api/method/login" method="POST" id="loginForm">
                    <div style="display: flex; flex-direction: column; gap: 1.25rem;">
                        <!-- Username/Email Field -->
                        <div class="input-group">
                            <input type="text" id="usr" name="usr" class="input-field" placeholder="Username" required>
                            <label for="usr" class="input-label">Email or Username</label>
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,9"></polyline>
                            </svg>
                        </div>

                        <!-- Password Field -->
                        <div class="input-group">
                            <input type="password" id="pwd" name="pwd" class="input-field" placeholder="Password" required>
                            <label for="pwd" class="input-label">Password</label>
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </div>

                        <!-- Remember Me & Forgot Password -->
                        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.875rem;">
                            <label style="display: flex; align-items: center; color: rgba(255,255,255,0.8); cursor: pointer;">
                                <input type="checkbox" style="margin-right: 0.5rem; accent-color: #667eea;">
                                Remember me
                            </label>
                            <a href="/forgot" class="link-text">Forgot password?</a>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="submit-btn" id="submitBtn">
                            <span id="btnText">Sign In</span>
                            <div class="spinner" id="btnSpinner" style="display: none;"></div>
                        </button>
                    </div>
                </form>

                <!-- Footer -->
                <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); text-align: center;">
                    <p style="color: rgba(255,255,255,0.6); font-size: 0.75rem;">
                        &copy; <span id="year"></span> {{ app_title }}. All rights reserved.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set current year
        document.getElementById('year').textContent = new Date().getFullYear();

        // Form submission handling
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        form.addEventListener('submit', function(e) {
            // Show loading state
            submitBtn.classList.add('loading');
            btnText.style.display = 'none';
            btnSpinner.style.display = 'block';
        });

        // Add input animations
        const inputs = document.querySelectorAll('.input-field');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.querySelector('.input-icon').style.transform = 'translateY(-50%) scale(1.1)';
            });
            input.addEventListener('blur', function() {
                this.parentElement.querySelector('.input-icon').style.transform = 'translateY(-50%) scale(1)';
            });
        });
    </script>
</body>
</html>
