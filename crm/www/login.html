<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ app_title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .form-input:focus ~ label,
        .form-input:not(:placeholder-shown) ~ label {
            top: -0.5rem;
            font-size: 0.75rem;
            color: #4f46e5;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-md p-8 rounded-2xl shadow-2xl relative overflow-hidden">
        <!-- Decorative elements -->
        <div class="absolute -top-10 -right-10 w-40 h-40 bg-purple-500 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"></div>
        <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-blue-500 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-2000"></div>

        <div class="relative z-10">
            <div class="text-center mb-10">
                <img src="{{ app_logo_url or '/assets/crm/images/logo.svg' }}" alt="Logo" class="h-16 mx-auto mb-4 drop-shadow-lg">
                <h2 class="text-3xl font-bold text-white mb-2">Welcome Back</h2>
                <p class="text-white/80">Sign in to your account</p>
            </div>

            <form action="/api/method/login" method="POST" class="space-y-6">
                <div class="relative">
                    <input type="text" id="usr" name="usr" class="form-input block w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-transparent focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent transition-all" placeholder="Email">
                    <label for="usr" class="absolute left-4 top-3 text-white/60 transition-all duration-200 cursor-text user-select-none pointer-events-none">Email or Username</label>
                </div>

                <div class="relative">
                    <input type="password" id="pwd" name="pwd" class="form-input block w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-transparent focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent transition-all" placeholder="Password">
                    <label for="pwd" class="absolute left-4 top-3 text-white/60 transition-all duration-200 cursor-text user-select-none pointer-events-none">Password</label>
                </div>

                <button type="submit" class="w-full py-3 px-4 bg-white text-indigo-600 font-bold rounded-lg shadow-lg hover:bg-indigo-50 transform hover:-translate-y-0.5 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-white">
                    Sign In
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="/forgot" class="text-sm text-white/80 hover:text-white transition-colors">Forgot password?</a>
            </div>
            
             <div class="mt-8 pt-6 border-t border-white/10 text-center text-xs text-white/50">
                &copy; {{ year }} {{ app_title }}. All rights reserved.
            </div>
        </div>
    </div>

    <script>
        // Simple client-side validation or enhancements can go here
        const form = document.querySelector('form');
        form.addEventListener('submit', function(e) {
            // Optional: Add loading state
             const btn = this.querySelector('button[type="submit"]');
             btn.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-indigo-600 inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Signing in...';
             btn.classList.add('opacity-75', 'cursor-wait');
        });
    </script>
    <style>
        /* Animation keyframes for blobs */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
    </style>
</body>
</html>
