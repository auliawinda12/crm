version: "3.7"
name: crm
services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  frappe:
    image: frappe/bench:latest
    command: bash /scripts/init-local.sh
    restart: unless-stopped
    environment:
      - SHELL=/bin/bash
    working_dir: /home/frappe
    volumes:
      - frappe-bench-data:/home/frappe
      - ./init-local.sh:/scripts/init-local.sh:ro
      # Mount local CRM app to container
      - ../crm:/home/frappe/frappe-bench/apps/crm:rw
      # Mount local frappe-ui for frontend development
      - ../frappe-ui:/home/frappe/frappe-bench/apps/frappe-ui:rw
    ports:
      - 8000:8000
      - 9000:9000
      - 5173:5173  # Vite dev server port
    depends_on:
      - mariadb
      - redis

volumes:
  mariadb-data:
  frappe-bench-data:
